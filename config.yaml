# SAGE-Traffic Configuration File
# Note: All hyperparameters, reward weights, thresholds, and simulation parameters go here.

network:
  net_file: "network/2x2_grid.net.xml"
  rou_file: "network/routes.rou.xml"
  sumocfg_file: "network/simulation.sumocfg"
  intersections: ["A", "B", "C", "D"]
  lane_length: 300.0          # meters for internal edges
  boundary_length: 200.0      # meters for boundary edges
  speed_limit: 13.89          # meters/sec (~50 km/h)
  num_lanes: 2                # lanes per direction

simulation:
  gui: false                  # set to true to visualize via sumo-gui
  seed: 42
  sim_max_steps: 100          # decision steps for test rollout
  step_duration: 5            # seconds per decision step (agent action interval)
  yellow_duration: 3          # seconds of yellow clearance when switching phases
  waiting_time_memory: 1000   # SUMO parameter for waiting time tracking

traffic_lights:
  phases:
    0: "GGGggrrrrrGGGggrrrrr"  # NS Green (Straight + Right + Left Yield)
    1: "yyyyyrrrrryyyyyrrrrr"  # NS Yellow Clearance
    2: "rrrrrGGGggrrrrrGGGgg"  # EW Green (Straight + Right + Left Yield)
    3: "rrrrryyyyyrrrrryyyyy"  # EW Yellow Clearance
  green_phases: [0, 2]         # Phase 0: NS Green, Phase 2: EW Green
  yellow_map:
    0: 1                       # Yellow phase when transitioning from Phase 0
    2: 3                       # Yellow phase when transitioning from Phase 2

agent:
  agents: ["A", "B", "C", "D"]
  # Action space: 4 discrete actions per agent
  # 0: keep phase, 1: switch phase, 2: extend green, 3: reduce green
  actions:
    0: "keep"
    1: "switch"
    2: "extend"
    3: "reduce"
  delta_green: 5               # seconds added/subtracted by extend/reduce actions
  min_green: 5                 # minimum green phase duration (seconds)
  max_green: 60                # maximum green phase duration (seconds)
  default_green_target: 30     # default green duration target (seconds)

observation:
  # Configurable feature list per intersection
  features:
    - "vehicle_count"
    - "queue_length"
    - "average_speed"
    - "lane_occupancy"
    - "waiting_time"
    - "current_phase"
    - "phase_duration"
  # Feature normalization bounds
  normalization:
    max_vehicle_count: 40.0    # max vehicle capacity per lane approach
    max_queue_length: 40.0     # max halted vehicles per lane approach
    max_speed: 13.89           # speed limit (m/s)
    max_waiting_time: 120.0    # waiting time normalization ceiling (s)
    max_phase_duration: 60.0   # phase duration normalization ceiling (s)

reward:
  # Multi-objective reward coefficients: R_i = - (w_queue * Q + w_delay * D + w_switch * S)
  w_queue: 0.1                 # coefficient for negative queue length
  w_delay: 0.05                # coefficient for negative waiting time / delay
  w_switch: 0.02               # small penalty for phase change to discourage rapid oscillation

demand:
  active_demand: "normal"      # default profile: "low", "normal", or "peak"
  simulation_duration: 1000    # total simulation duration in seconds for route generation
  profiles:
    low:
      description: "Light traffic flow"
      veh_per_hour_per_origin: 300
      prob_insertion_per_step: 0.083
    normal:
      description: "Moderate urban traffic flow"
      veh_per_hour_per_origin: 720
      prob_insertion_per_step: 0.200
    peak:
      description: "Heavy peak-hour traffic flow"
      veh_per_hour_per_origin: 1260
      prob_insertion_per_step: 0.350
  vehicle_types:
    car:
      accel: 2.6
      decel: 4.5
      sigma: 0.5
      length: 5.0
      minGap: 2.5
      maxSpeed: 13.89

# Phase 3 Independent PPO Hyperparameters
ppo:
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  epochs: 4
  minibatch_size: 32
  hidden_dims: [64, 64]
  train_episodes: 40
  steps_per_episode: 100

# Phase 3 Fixed-Time Baseline Controller
fixed_time:
  green_time: 30               # seconds of green phase per direction (NS / EW)
  yellow_time: 3               # seconds of yellow clearance
  eval_episodes: 10            # evaluation episodes for fair comparison

# Phase 4 Multi-Agent PPO (MAPPO - Centralized Training, Decentralized Execution)
mappo:
  share_policy: true           # true: shared actor with agent-ID embedding; false: separate actors
  agent_id_emb_dim: 4          # 4-dim one-hot agent ID representation
  hidden_dims_actor: [64, 64]  # hidden layers for decentralized actor
  hidden_dims_critic: [128, 64]# hidden layers for centralized critic (receives 172-dim global state)
  lr_actor: 0.0003             # learning rate for decentralized actor
  lr_critic: 0.0005            # learning rate for centralized critic
  gamma: 0.99                  # discount factor
  gae_lambda: 0.95             # GAE lambda
  clip_ratio: 0.2              # PPO surrogate clipping epsilon
  value_coef: 0.5              # value function loss weight
  entropy_coef: 0.01           # entropy bonus weight
  max_grad_norm: 0.5           # gradient norm clipping threshold
  epochs: 4                    # PPO update epochs per rollout
  minibatch_size: 32           # minibatch size
  train_episodes: 40           # training episodes matching Phase 3
  steps_per_episode: 100       # decision steps per episode matching Phase 3

# Phase 5 MAPPO with Temporal Transformer Encoder
transformer:
  history_length: 4            # k = 4 timesteps history window (20 seconds)
  embedding_dim: 64            # projected feature & transformer state dimension
  num_heads: 4                 # multi-head self-attention heads (64 % 4 == 0)
  num_layers: 2                # number of TransformerEncoder layers
  dim_feedforward: 128         # inner feedforward dimension
  dropout: 0.0                 # dropout probability
  lr_actor: 0.0003             # learning rate for temporal actor + transformer
  lr_critic: 0.0005            # learning rate for temporal critic + transformer
  gamma: 0.99                  # discount factor matching Phase 4
  gae_lambda: 0.95             # GAE lambda matching Phase 4
  clip_ratio: 0.2              # PPO clipping epsilon matching Phase 4
  value_coef: 0.5              # value loss coefficient matching Phase 4
  entropy_coef: 0.01           # entropy coefficient matching Phase 4
  max_grad_norm: 0.5           # gradient clipping threshold matching Phase 4
  epochs: 4                    # PPO epochs matching Phase 4
  minibatch_size: 32           # minibatch size matching Phase 4
  train_episodes: 40           # training episodes matching Phase 4
  steps_per_episode: 100       # decision steps per episode matching Phase 4

# Phase 6 MAPPO with Temporal Transformer + Graph Attention Network (GAT)
gat:
  enabled: true
  input_dim: 64                # input dimension from temporal transformer
  hidden_dim: 64               # GAT output node dimension
  num_heads: 4                 # multi-head attention heads (64 % 4 == 0)
  concat_heads: false          # average heads to preserve 64-D output
  dropout: 0.0                 # dropout rate
  add_self_loops: true         # include self-loops in adjacency
  lr_actor: 0.0003             # learning rate for actor + transformer + GAT
  lr_critic: 0.0005            # learning rate for centralized critic
  gamma: 0.99                  # discount factor
  gae_lambda: 0.95             # GAE lambda
  clip_ratio: 0.2              # PPO surrogate clipping epsilon
  value_coef: 0.5              # value loss coefficient
  entropy_coef: 0.01           # entropy coefficient
  max_grad_norm: 0.5           # gradient clipping threshold
  epochs: 4                    # PPO epochs per rollout
  minibatch_size: 32           # minibatch size
  train_episodes: 40           # 40 episodes matching Phase 3, 4, 5
  steps_per_episode: 100       # 100 decision steps matching Phase 3, 4, 5

# Phase 7 MAPPO with Learnable Communication Gate
communication:
  enabled: true
  hidden_dim: 32               # inner hidden dimension of gate MLP
  threshold: 0.5               # hard communication decision threshold
  cost: 0.01                   # lambda_comm penalty per communicated message
  context_type: "heuristic"    # normalized queue difference
  log_attention: true
  log_gate_values: true
  lr_actor: 0.0003             # learning rate for actor + transformer + GAT + gate
  lr_critic: 0.0005            # learning rate for centralized critic
  gamma: 0.99                  # discount factor
  gae_lambda: 0.95             # GAE lambda
  clip_ratio: 0.2              # PPO clipping epsilon
  value_coef: 0.5              # value loss coefficient
  entropy_coef: 0.01           # entropy coefficient
  max_grad_norm: 0.5           # gradient clipping threshold
  epochs: 4                    # PPO epochs per rollout
  minibatch_size: 32           # minibatch size
  train_episodes: 40           # 40 episodes matching earlier phases
  steps_per_episode: 100       # 100 decision steps matching earlier phases
# Phase 8 Causal Influence Estimation
causal_influence:
  enabled: true
  method: "granger_style"      # "granger_style" or "fixed_structural"
  history_length: 5            # minimal history steps for predictive regression
  window_size: 15              # rolling history window size
  score_min: 0.0
  score_max: 1.0
  warmup_value: 0.5
  ridge_lambda: 0.001          # L2 regularization for stable linear regression
  log_scores: true

# Phase 8R: Improved Causal Communication
phase8r:
  enabled: true
  causal:
    enabled: true
    history_window: 15
    ridge_lambda: 0.001
    causal_embedding_dim: 8     # dimension of dedicated causal pathway phi(C_ij)
    hidden_dim: 16              # inner hidden dimension of phi(C_ij) MLP
  communication:
    hidden_dims: [64, 32]       # gate MLP hidden layer dimensions
    lambda_comm: 0.01           # communication cost penalty coefficient
    budget_penalty_coef: 0.05   # penalty coefficient for exceeding target ratio
    target_ratio: 0.50          # target communication ratio
    hard_threshold: 0.5         # hard evaluation decision threshold
  training:
    train_episodes: 40
    steps_per_episode: 100
    lr_actor: 0.0003
    lr_critic: 0.0005
